[server]
# Streamlit rejects larger uploads before our code runs.
# Our own validator (PDF_LIMITS) still checks independently.
maxUploadSize = 10   # MB

[browser]
# Don't send anonymous usage statistics to Streamlit.
gatherUsageStats = false
   [client]
   # Never show Python tracebacks to users; errors appear only in server logs.
   showErrorDetails = "none"